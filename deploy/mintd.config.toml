# cdk-mintd configuration for a fibernuts RUSD mint.
#
# This runs a STOCK, unforked cdk-mintd (v0.18.3). The `grpc-processor` backend it needs is one of
# its default cargo features.
#
#   cargo install cdk-mintd --version 0.18.3 --locked
#   export CDK_MINTD_MNEMONIC="your twelve word mnemonic"
#   cdk-mintd --work-dir /tmp/fibernuts-mint config init --new-mint \
#     --file deploy/mintd.config.toml
#   cdk-mintd --work-dir /tmp/fibernuts-mint

[info]
url = "http://127.0.0.1:8085"
listen_host = "127.0.0.1"
listen_port = 8085
# The secret is resolved from the environment during config init and every later start.
mnemonic = "env:CDK_MINTD_MNEMONIC"

[payment_backend]
# Exact serde spelling. Not "grpc-processor", not "grpc_processor".
backend = "grpcprocessor"

# Must resolve to the same normalized custom unit that fibernuts-processor reports from
# get_settings(). Keep the canonical lowercase spelling at every boundary.
unit = "rusd"

# Denominated in ecash units: 1 unit = 1 RUSD cent, so this is $0.01 .. $5,000.00.
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[grpc_processor]
# Both sides use a bare IP. cdk-mintd adds the http/https scheme from the TLS setting.
address = "127.0.0.1"
port = 50051
# Plaintext is permitted only because both processes share loopback. Use mTLS for separate hosts.
allow_insecure = true

# CDK 0.18 requires a non-empty allowlist; the processor's get_settings response must still match.
supported_units = ["rusd"]
