# fibernuts — the hosted mint, payment relay, and bounded testnet claim service on one box.
#
#   fnn (Fiber node) ── loopback ── fibernuts-processor ── loopback ── cdk-mintd
#   faucet-fnn (separate payer node) ── loopback ── faucet
#   plus an isolated payment relay; Caddy terminates TLS for the three public HTTP APIs.
#
# The processor and mintd join fnn's network namespace (`network_mode: service:fnn`) so all three
# reach each other on 127.0.0.1 — which keeps fnn's RPC private (no biscuit auth needed) while its
# P2P port is public for routing. Because they share fnn's namespace, they publish NO ports of
# their own: every published port is declared on the `fnn` service.
#
# First run:  cp .env.example .env  (fill it in),  then  docker compose up -d --build

name: fibernuts

services:
  # ── detect THIS server's public IP once, so you never type it in ────────────
  ipinit:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        for u in https://api.ipify.org https://ifconfig.me https://icanhazip.com; do
          ip=$$(wget -qO- "$$u" 2>/dev/null | tr -d '[:space:]'); [ -n "$$ip" ] && break
        done
        printf '%s' "$${PUBLIC_IP:-$$ip}" > /mint/public_ip
        printf '%s' "$${PUBLIC_IP:-$$ip}" > /faucet/public_ip
        echo "[ipinit] public IP: $$(cat /mint/public_ip)"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}      # optional override; normally auto-detected
    volumes:
      - fnn-data:/mint
      - faucet-fnn-data:/faucet
    networks: [mintnet]
    restart: "no"

  # ── the Fiber node: public P2P, private loopback RPC ────────────────────────
  fnn:
    image: nervos/fiber:0.9.0-rc7
    entrypoint: ["/bin/sh", "/fnn-entrypoint.sh"]
    environment:
      # Both optional — the node password is auto-generated, the IP auto-detected.
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      MINT_NODE_NAME: ${MINT_NODE_NAME:-fibernuts-mint}
      RUST_LOG: info
    volumes:
      - fnn-data:/fiber
      - ./fnn-entrypoint.sh:/fnn-entrypoint.sh:ro
    ports:
      - "8228:8228"       # Fiber P2P — public, required for routing/announcement
    networks: [mintnet]
    depends_on:
      ipinit:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "fnn-cli", "--url", "http://127.0.0.1:8227", "info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── a separate payer node for fixed community testnet claims ────────────────
  faucet-fnn:
    image: nervos/fiber:0.9.0-rc7
    entrypoint: ["/bin/sh", "/fnn-entrypoint.sh"]
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FAUCET_FIBER_SECRET_KEY_PASSWORD:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      FIBER_NODE_NAME: ${FAUCET_NODE_NAME:-fibernuts-faucet}
      FIBER_ANNOUNCED_P2P_PORT: "8238"
      RUST_LOG: info
    volumes:
      - faucet-fnn-data:/fiber
      - ./fnn-entrypoint.sh:/fnn-entrypoint.sh:ro
    ports:
      - "8238:8228"       # separate public P2P port; RPC remains private
    networks: [mintnet]
    depends_on:
      ipinit:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "fnn-cli", "--url", "http://127.0.0.1:8227", "info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── the cdk-fiber gRPC backend ──────────────────────────────────────────────
  processor:
    build:
      context: ../mint
      dockerfile: ../deploy/processor.Dockerfile
    environment:
      FIBERNUTS_FIBER_RPC: http://127.0.0.1:8227
      FIBERNUTS_LISTEN_ADDR: 127.0.0.1
      FIBERNUTS_LISTEN_PORT: "50051"
      FIBERNUTS_NETWORK: testnet
      FIBERNUTS_UNIT: rusd
      FIBERNUTS_UNIT_SCALE: "1000000"
      RUST_LOG: info,cdk_fiber=debug
    network_mode: "service:fnn"     # share fnn's loopback; reach it at 127.0.0.1:8227
    depends_on:
      fnn:
        condition: service_healthy
    restart: unless-stopped

  # ── the stock Cashu mint (unforked, official image) ─────────────────────────
  mintd:
    image: cashubtc/mintd:0.17.2
    # This image has CMD ["cdk-mintd"] and NO ENTRYPOINT, so the binary name must be repeated.
    command: ["cdk-mintd", "--work-dir", "/data", "--config", "/data/config.toml", "--enable-logging"]
    environment:
      CDK_MINTD_URL: https://${MINT_DOMAIN}
      CDK_MINTD_MNEMONIC: ${MINT_MNEMONIC}
    volumes:
      - mintd-data:/data
      - ./mintd.host.toml:/data/config.toml:ro
    network_mode: "service:fnn"     # reach the processor at 127.0.0.1:50051
    depends_on:
      - processor
    restart: unless-stopped

  # ── capability-scoped NUT-18 payment delivery ──────────────────────────────
  relay:
    build:
      context: ../relay
      dockerfile: Dockerfile
    environment:
      FIBERNUTS_RELAY_HOST: 0.0.0.0
      FIBERNUTS_RELAY_PORT: "8090"
      FIBERNUTS_RELAY_DATABASE: /app/data/relay.sqlite3
      FIBERNUTS_RELAY_PUBLIC_ORIGIN: https://${RELAY_DOMAIN}
      FIBERNUTS_RELAY_ALLOWED_ORIGINS: ${MARKET_ALLOWED_ORIGINS}
      FIBERNUTS_RELAY_MAX_TTL_SECONDS: ${RELAY_MAX_TTL_SECONDS:-600}
      FIBERNUTS_RELAY_RETENTION_SECONDS: ${RELAY_RETENTION_SECONDS:-3600}
      FIBERNUTS_RELAY_MAX_REQUESTS_PER_MINUTE: ${RELAY_MAX_REQUESTS_PER_MINUTE:-120}
    volumes:
      - relay-data:/app/data
    networks: [mintnet]
    restart: unless-stopped

  # ── fixed-amount quote payer; never exposes the payer node's RPC ────────────
  faucet:
    build:
      context: ../faucet
      dockerfile: Dockerfile
    environment:
      FIBERNUTS_FAUCET_HOST: 0.0.0.0
      FIBERNUTS_FAUCET_PORT: "8091"
      FIBERNUTS_FAUCET_DATABASE: /app/data/faucet.sqlite3
      FIBERNUTS_FAUCET_PUBLIC_ORIGIN: https://${FAUCET_DOMAIN}
      FIBERNUTS_FAUCET_ALLOWED_ORIGINS: ${MARKET_ALLOWED_ORIGINS}
      FIBERNUTS_FAUCET_MINT_URL: https://${MINT_DOMAIN}
      FIBERNUTS_FAUCET_MINT_API_URL: http://fnn:8085
      FIBERNUTS_FAUCET_FIBER_RPC: http://127.0.0.1:8227
      FIBERNUTS_FAUCET_IDENTIFIER_SECRET: ${FAUCET_IDENTIFIER_SECRET}
      FIBERNUTS_FAUCET_TRUST_PROXY: "true"
      FIBERNUTS_FAUCET_ENABLED: ${FAUCET_ENABLED:-false}
      FIBERNUTS_FAUCET_AMOUNT: ${FAUCET_AMOUNT:-1000}
      FIBERNUTS_FAUCET_CLIENT_COOLDOWN_SECONDS: ${FAUCET_CLIENT_COOLDOWN_SECONDS:-86400}
      FIBERNUTS_FAUCET_NETWORK_DAILY_CLAIM_LIMIT: ${FAUCET_NETWORK_DAILY_CLAIM_LIMIT:-3}
      FIBERNUTS_FAUCET_DAILY_CLAIM_LIMIT: ${FAUCET_DAILY_CLAIM_LIMIT:-25}
      FIBERNUTS_FAUCET_MAX_REQUESTS_PER_MINUTE: ${FAUCET_MAX_REQUESTS_PER_MINUTE:-120}
    volumes:
      - faucet-data:/app/data
    network_mode: "service:faucet-fnn"
    depends_on:
      faucet-fnn:
        condition: service_healthy
      mintd:
        condition: service_started
    restart: unless-stopped

  # ── TLS reverse proxy for the mint API ──────────────────────────────────────
  caddy:
    image: caddy:2
    environment:
      MINT_DOMAIN: ${MINT_DOMAIN}
      RELAY_DOMAIN: ${RELAY_DOMAIN}
      FAUCET_DOMAIN: ${FAUCET_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    networks: [mintnet]
    depends_on:
      - fnn                # mintd shares fnn's namespace, so Caddy proxies to fnn:8085
      - relay
      - faucet
    restart: unless-stopped

networks:
  mintnet:
    driver: bridge

volumes:
  fnn-data:      # config.yml, the encrypted CKB key, channel + graph store — BACK THIS UP
  faucet-fnn-data: # separate funded payer key, channel, and graph store — BACK THIS UP
  mintd-data:    # SQLite: which quotes are paid, which proofs are spent
  caddy-data:    # Let's Encrypt certificates
  caddy-config:
  relay-data:    # short-lived payment payloads and order capabilities
  faucet-data:   # claim idempotency and aggregate demand counters
