name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        
    - name: Build
      run: cargo build --manifest-path mint/Cargo.toml --verbose
      
    - name: Run tests
      run: cargo test --manifest-path mint/Cargo.toml --verbose
